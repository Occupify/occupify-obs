apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
    editable: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "Corr-([a-zA-Z0-9-]+)"
          name: TraceID
          url: "$${__value.raw}"
    editable: true

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://10.0.1.78:3201
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
    editable: true
